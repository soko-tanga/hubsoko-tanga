<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOKO LA MIFUGO NA MAZAO YA UVUVI - Tanga</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#FFF7ED;color:#222;padding-bottom:90px}
header{background:linear-gradient(135deg,#FF6B00,#0E9A8B);color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:10}
.logo{width:72px;height:72px;border-radius:50%;background:#fff;color:#FF6B00;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto;cursor:pointer;border:3px solid #FFD166;object-fit:cover}
h1{font-size:19px;margin:8px 0 2px}.tag{font-size:12px;background:#FFD166;color:#333;padding:4px 10px;border-radius:20px;display:inline-block;font-weight:700}
.trial{background:#fff3cd;border:1px dashed #FF6B00;padding:8px;margin:10px;border-radius:10px;text-align:center;font-size:13px}
.tabs{display:flex;gap:8px;padding:10px}.tab{flex:1;padding:14px;border-radius:14px;border:2px solid #ddd;background:#fff;text-align:center;font-weight:800;cursor:pointer}.tab.active{border-color:#FF6B00;background:#FFE8D0}.tab small{display:block;font-weight:400;font-size:12px}
.card{background:#fff;margin:10px;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer}.b1{background:#FF6B00;color:#fff}.b2{background:#0E9A8B;color:#fff}.b3{background:#FFD166}.b4{background:#222;color:#fff}.b5{background:#fff;border:2px solid #0E9A8B;color:#0E9A8B}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}label{font-size:13px;font-weight:700}
.item{border:1px solid #eee;border-radius:12px;padding:10px;margin:8px 0;background:#fff}.item img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#eee}
