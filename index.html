<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soko la mifugo na mazao ya uvuvi-Tanga</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f1f5f9;padding-bottom:30px}
.c{max-width:900px;margin:auto;padding:12px}
header{background:#16a34a;color:white;padding:14px;text-align:center}
header h1{font-size:22px;line-height:1.25;padding:0 10px}
.logo{width:60px;height:60px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin:auto;border:3px solid #facc15;cursor:pointer;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.btn{display:block;padding:14px;border-radius:10px;color:#fff;font-weight:bold;text-align:center;text-decoration:none;border:none;width:100%;cursor:pointer}
.g{background:#16a34a}.b{background:#0284c7}.p{background:#7c3aed}.o{background:#ea580c}.gr{background:#64748b}.r{background:#dc2626}.y{background:#ca8a04}
.box{background:#fff;padding:14px;border-radius:14px;margin-bottom:12px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0}
label{font-size:13px;font-weight:bold}
.item{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:10px}
.pic{width:70px;height:70px;border-radius:10px;background:#dcfce7;display:flex;align-items:center;justify-content:center;font-size:35px;flex-shrink:0;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic2{background:#dbeafe}
.small{font-size:12px;color:#555}
.call{background:#16a34a;color:#fff;padding:10px;border-radius:8px;font-size:20px;font-weight:bold;flex:1;text-align:center;text-decoration:none;display:block}
.wa{background:#25D366;color:#fff;padding:10px;border-radius:8px;font-size:20px;font-weight:bold;flex:1;text-align:center;text-decoration:none;display:block}
.del{background:#fee2e2;color:#dc2626;border:none;padding:6px 10px;border-radius:8px;font-size:12px;margin-top:6px;cursor:pointer}
.editBtn{background:#dbeafe;color:#1d4ed8;border:none;padding:6px 10px;border-radius:8px;font-size:12px;margin-top:6px;cursor:pointer;margin-right:4px}
.statusBtn{background:#fef3c7;color:#92400e;border:none;padding:6px 10px;border-radius:8px;font-size:12px;margin-top:6px;cursor:pointer;margin-right:4px}
.repBtn{background:#fff7ed;color:#9a3412;border:none;padding:6px 10px;border-radius:8px;font-size:12px;margin-top:6px;cursor:pointer}
.nav{display:flex;gap:6px;margin-bottom:10px}.nav button{flex:1}
.nav2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.nav2 button{flex:1;min-width:70px;padding:10px;font-size:12px}
.badge{background:#ede9fe;color:#7c3aed;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.badgeG{background:#dcfce7;color:#166534;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.badgeR{background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.badgeY{background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.closeRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.closeBtn{background:#fee2e2;color:#dc2626;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.prev{width:100%;max-height:160px;object-fit:cover;border-radius:10px;display:none;margin:6px 0}
.cover{width:100%;height:130px;object-fit:cover;border-radius:10px;display:none;margin-bottom:8px}
@media(min-width:700px){#pg-mifugo,#pg-uvuzi,#pg-maduka,#pg-admin{max-width:760px;margin:auto}}
</style>
</head>
