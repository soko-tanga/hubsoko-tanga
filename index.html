<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f1f5f9;padding-bottom:95px}
header{background:#16a34a;color:white;padding:12px;text-align:center;position:sticky;top:0;z-index:10;cursor:pointer}
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:10px}
.logo{width:52px;height:52px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #facc15;flex-shrink:0}
.logo-text{text-align:left;line-height:1.1}
.logo-text h1{font-size:22px;margin:0}
.logo-text p{font-size:12px;opacity:.9}
.nembo-banner{background:white;border-radius:16px;padding:14px;text-align:center;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);border:2px solid #16a34a}
.nembo-big{width:80px;height:80px;background:#16a34a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;margin:auto;border:4px solid #facc15}
.container{max-width:480px;margin:auto;padding:12px}
.market-card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1);margin-bottom:16px}
.market-img{width:100%;height:170px;object-fit:cover;display:block}
.market-body{padding:14px}
.btn{display:block;width:100%;border:none;padding:14px;border-radius:10px;color:white;font-weight:bold;font-size:15px;cursor:pointer;text-decoration:none;text-align:center}
.btn-green{background:#16a34a}.btn-blue{background:#0284c7}.btn-orange{background:#ea580c}.btn-purple{background:#7c3aed}.btn-red{background:#dc2626}.btn-gray{background:#64748b}.btn-teal{background:#0d9488}
.product{background:white;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);display:flex;gap:12px}
.product img{width:95px;height:95px;object-fit:cover;border-radius:10px;background:#eee}
.product-info{flex:1}.price{color:#16a34a;font-weight:bold;font-size:16px}
.call-btn{background:#16a34a;color:white;border:none;padding:9px 10px;border-radius:8px;font-weight:bold;font-size:13px;flex:1;text-decoration:none;text-align:center;display:block}
.wa-btn{background:#25D366;color:white;border:none;padding:9px 10px;border-radius:8px;font-weight:bold;font-size:13px;flex:1;text-decoration:none;text-align:center;display:block}
.hidden{display:none}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:15px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;border-top:1px solid #eee;max-width:480px;margin:auto;z-index:20}
.bottom-nav a{flex:1;padding:11px 2px;text-decoration:none;color:#000;font-size:11px;font-weight:bold;text-align:center;display:block;background:white}
.section-title{font-size:18px;margin:14px 0 8px}
.badge{display:inline-block;background:#dcfce7;color:#166534;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:bold}
.badge-oda{display:inline-block;background:#fef3c7;color:#92400e;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:bold}
label{font-size:13px;font-weight:bold;color:#334155}
.oda-card{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);border-left:5px solid #f59e0b}
.form-box{background:white;padding:16px;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.uko-ndani{background:#16a34a;color:white;padding:12px;border-radius:12px;text-align:center;font-weight:bold;margin-bottom:10px}
.uko-ndani-blue{background:#0284c7;color:white;padding:12px;border-radius:12px;text-align:center;font-weight:bold;margin-bottom:10px}
.uko-ndani-orange{background:#ea580c;color:white;padding:12px;border-radius:12px;text-align:center;font-weight:bold;margin-bottom:10px}
.uko-ndani-teal{background:#0d9488;color:white;padding:12px;border-radius:12px;text-align:center;font-weight:bold;margin-bottom:10px}
.uko-ndani-purple{background:#7c3aed;color:white;padding:12px;border-radius:12px;text-align:center;font-weight:bold;margin-bottom:10px}
.page{display:none}
.page.active{display:block}
.menu-box{background:white;padding:10px;border-radius:12px;margin-bottom:10px}
.menu-row{display:flex;gap:6px;margin-bottom:6px}
.menu-row a{flex:1;background:#f8fafc;border:1px solid #ddd;padding:10px 4px;border-radius:10px;font-weight:bold;font-size:12px;text-decoration:none;color:#000;text-align:center;display:block}
.pin-box{background:#fffbeb;border:2px solid #facc15;padding:14px;border-radius:12px;margin:12px 0}
</style>
