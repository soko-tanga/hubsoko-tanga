<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Soko la Mifugo</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#f1f5f9;padding-bottom:20px}.container{max-width:480px;margin:auto;padding:12px}header{background:#16a34a;color:white;padding:12px;text-align:center}header a{color:white;text-decoration:none}.menu{background:white;padding:10px;border-radius:12px;margin-bottom:10px}.menu a{flex:1;background:#f8fafc;border:1px solid #ddd;padding:10px 4px;border-radius:10px;font-weight:bold;font-size:12px;text-decoration:none;color:#000;text-align:center;display:block}.row{display:flex;gap:6px;margin-bottom:6px}.btn{display:block;padding:14px;border-radius:10px;color:white;font-weight:bold;text-align:center;text-decoration:none;border:none;width:100%;cursor:pointer}.green{background:#16a34a}.orange{background:#ea580c}.gray{background:#64748b}.product{background:white;border-radius:14px;padding:12px;margin-bottom:12px;display:flex;gap:12px}.img{width:95px;height:95px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:45px;background:#dcfce7;flex-shrink:0}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0}label{font-size:13px;font-weight:bold}.box{background:white;padding:16px;border-radius:14px;margin-bottom:12px}.call{background:#16a34a;color:white;padding:9px;border-radius:8px;font-weight:bold;font-size:13px;flex:1;text-align:center;text-decoration:none;display:block}.wa{background:#25D366;color:white;padding:9px;border-radius:8px;font-weight:bold;font-size:13px;flex:1;text-align:center;text-decoration:none;display:block}.oda{background:white;border-radius:14px;padding:14px;margin-bottom:12px;border-left:5px solid #f59e0b}</style></head>
<body><header><a href="index.html"><h1>SOKO LA TANGA</h1><p>🐐 SOKO LA MIFUGO</p></a></header>
<div class="container">
<div style="background:#16a34a;color:white;padding:12px;border-radius:12px;text-align:center;font-weight:bold">📍 UKO NDANI YA SOKO LA MIFUGO 🐐</div>
<div class="menu"><div class="row"><a href="index.html">🏠 NYUMBANI</a><a href="maduka.html">🏪 MADUKA YETU</a><a href="uvuzi.html">🐟 UVUVI</a></div></div>
<h2>🐐 SOKO LA MIFUGO</h2><br><div id="list"></div>
<div class="box"><h3>📢 UZA MIFUGO</h3><label>Jina la Bidhaa</label><input id="f-name" placeholder="Mbuzi wa Kuchinja"><label>Bei</label><input id="f-price" type="number" placeholder="180000"><label>Idadi</label><input id="f-qty" type="number" placeholder="5"><label>Jina lako</label><input id="f-seller" placeholder="Jina lako"><label>Simu</label><input id="f-phone" placeholder="0755000000"><button class="btn green" onclick="uza()">TANGAZA MIFUGO ✅</button></div>
<div class="box"><h3>🙏 ODA YA KUHITAJI MIFUGO</h3><label>Unahitaji nini?</label><input id="r-need" placeholder="Mbuzi 10"><label>Idadi</label><input id="r-qty" placeholder="10"><label>Jina lako</label><input id="r-name" placeholder="Jina lako"><label>Simu</label><input id="r-phone" placeholder="0755000000"><button class="btn orange" onclick="tumaOda()">TUMA ODA YA MIFUGO 🙏</button></div>
<h3>📋 ANGALIA ODA ZA MIFUGO</h3><br><div id="oda-list"></div>
<br><a href="index.html" class="btn gray">← RUDI NYUMBANI</a>
</div>
<script>
var products=[{name:"Mbuzi wa Kuchinja",price:180000,qty:5,seller:"Juma Mifugo Bora",phone:"0755000000",wilaya:"Tanga Mjini",emoji:"🐐"},{name:"Ng'ombe",price:850000,qty:2,seller:"Korogwe Mifugo",phone:"0755000001",wilaya:"Korogwe",emoji:"🐄"}];
try{var s=localStorage.getItem('soko_mifugo'); if(s) products=JSON.parse(s);}catch(e){}
var odas=[{need:"Mbuzi 10 wa kuchinja",qty:"10",name:"Asha",phone:"0755111222"}];
try{var o=localStorage.getItem('soko_oda_mifugo'); if(o) odas=JSON.parse(o);}catch(e){}
function render(){var h=''; for(var i=0;i<products.length;i++){var p=products[i]; var wa=(p.phone||'').replace(/^0/,'255'); h+='<div class="product"><div class="img">'+(p.emoji||'🐐')+'</div><div style="flex:1"><b>'+p.name+'</b><br><small>🏪 '+p.seller+' • 📍 '+(p.wilaya||'')+'</small><br>Bei: <b style="color:#16a34a">'+Number(p.price||0).toLocaleString()+' TSh</b> • Idadi: <b>'+p.qty+'</b><div style="display:flex;gap:6px;margin-top:10px"><a class="call" href="tel:'+p.phone+'">📞 PIGA SIMU</a><a class="wa" href="https://wa.me/'+wa+'">💬 WHATSAPP</a></div></div></div>';} document.getElementById('list').innerHTML=h;
var oh=''; for(var j=0;j<odas.length;j++){var r=odas[j]; var wa2=(r.phone||'').replace(/^0/,'255'); oh+='<div class="oda"><b>🙏 '+r.need+'</b><br><small>👤 '+r.name+'</small><br><small>Idadi: <b>'+r.qty+'</b></small><div style="display:flex;gap:6px;margin-top:10px"><a class="call" href="tel:'+r.phone+'">📞 MPIGIE MTEJA</a><a class="wa" href="https://wa.me/'+wa2+'">💬 NINAYO - MJIBU</a></div></div>';} document.getElementById('oda-list').innerHTML=oh;}
function uza(){var n=document.getElementById('f-name').value; var pr=parseInt(document.getElementById('f-price').value); var ph=document.getElementById('f-phone').value; if(!n||!pr||!ph){alert('Weka jina, bei na simu!'); return;} products.unshift({name:n,price:pr,qty:document.getElementById('f-qty').value||1,seller:document.getElementById('f-seller').value||'Mfanyabiashara',phone:ph,wilaya:'Tanga',emoji:'🐐'}); try{localStorage.setItem('soko_mifugo',JSON.stringify(products));}catch(e){} render(); alert('Imeongezwa ✅');}
function tumaOda(){var n=document.getElementById('r-need').value; var q=document.getElementById('r-qty').value; var nm=document.getElementById('r-name').value; var ph=document.getElementById('r-phone').value; if(!n||!q||!nm||!ph){alert('Jaza sehemu zote'); return;} odas.unshift({need:n,qty:q,name:nm,phone:ph}); try{localStorage.setItem('soko_oda_mifugo',JSON.stringify(odas));}catch(e){} render(); alert('ODA imetumwa ✅');}
render();
</script></body></html>
